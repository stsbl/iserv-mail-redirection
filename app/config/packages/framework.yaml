framework:
    secret: '%env(file:APP_SECRET_FILE)%'
    csrf_protection: true
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native
        gc_probability: 0
    assets:
        json_manifest_path: '%kernel.project_dir%/public/static/manifest.json'
        packages:
            crud:
                json_manifest_path: '%kernel.project_dir%/public/bundles/iservcrud/manifest.json'
            iserv-autocomplete:
                json_manifest_path: '%kernel.project_dir%/public/bundles/iservautocomplete/manifest.json'
            iserv-filesystem:
                json_manifest_path: '%kernel.project_dir%/public/bundles/iservfilesystem/manifest.json'
            iserv-form:
                json_manifest_path: '%kernel.project_dir%/public/bundles/iservform/manifest.json'
            iserv-bootstrap:
                json_manifest_path: '%kernel.project_dir%/public/bundles/iservbootstrap/manifest.json'
    php_errors:
        log: '%kernel.debug%'
        throw: true

when@dev:
    framework:
        secret: 'mail-redirection-framework-secret'

when@test:
    framework:
        assets:
            strict_mode: false
